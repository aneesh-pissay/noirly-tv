plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.noirly.tv.udemy'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.noirly.tv.udemy'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideloaded over ADB like the launcher: signed with the debug key. Sign your own releases with your key.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
